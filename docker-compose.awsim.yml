# docker-compose.awsim.yml — AWSIM + Autoware (no CARLA)
#
# AWSIM publishes Autoware-compatible ROS2 topics natively; no ROS bridge needed.
# AWSIM requires a display (no headless mode in v1.1.1).
#
# Usage:
#   DISPLAY=:0 xhost +local:docker
#   docker compose -f docker-compose.awsim.yml up

x-ros-common: &ros-common
  network_mode: host
  ipc: host
  pid: host
  environment: &ros-env
    ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    RCUTILS_COLORIZED_OUTPUT: "1"

services:

  # ── AWSIM Labs Simulator ─────────────────────────────────────────────────
  awsim:
    build:
      context: .
      dockerfile: docker/awsim/Dockerfile
      args:
        AWSIM_VERSION: "${AWSIM_VERSION:-1.1.1}"
    image: "ads/awsim:${AWSIM_VERSION:-1.1.1}"
    container_name: awsim
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      DISPLAY: "${DISPLAY:-:0}"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, video, display, utility]

  # ── Autoware Full Stack ──────────────────────────────────────────────────
  autoware:
    build:
      context: .
      dockerfile: docker/autoware/Dockerfile
    image: ads/autoware:humble-2024.06
    container_name: autoware
    restart: unless-stopped
    runtime: nvidia
    depends_on:
      - awsim
    <<: *ros-common
    environment:
      <<: *ros-env
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      MPC_MODEL_PATH: "${MPC_MODEL_PATH:-/home/carla/sdks/mpc/carla}"
      WAYPOINTS_CSV: "${WAYPOINTS_CSV:-/waypoints/waypoints.csv}"
      VEHICLE_ID: "${VEHICLE_ID:-default}"
    volumes:
      - ./config:/config:ro
      - ./launch:/launch:ro
      - ./maps:/maps:ro
      - ./data/waypoints:/waypoints:ro
      - autoware-data:/home/carla/autoware_data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    command: >
      /bin/bash -c "
        sudo sysctl -w net.core.rmem_max=2147483647 &&
        sudo ip link set lo multicast on &&
        source /opt/ros/humble/setup.bash &&
        source /home/carla/carla_ros_ws/install/setup.bash &&
        ros2 launch autonomous_driving_simulators autoware/autoware.launch.xml
          use_sim_time:=true
          launch_perception:=true
      "

  # ── Custom Control & Mapping Nodes ───────────────────────────────────────
  custom-nodes:
    build:
      context: .
      dockerfile: docker/custom-nodes/Dockerfile
    image: ads/custom-nodes:humble
    container_name: custom-nodes
    restart: unless-stopped
    runtime: nvidia
    depends_on:
      - awsim
    <<: *ros-common
    environment:
      <<: *ros-env
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      MPC_MODEL_PATH: "${MPC_MODEL_PATH:-/home/carla/sdks/mpc/carla}"
      WAYPOINTS_CSV: "${WAYPOINTS_CSV:-/waypoints/waypoints.csv}"
    volumes:
      - ./config:/config:ro
      - ./launch:/launch:ro
      - ./maps:/maps:ro
      - ./data/waypoints:/waypoints:ro
      - ./custom.repos:/home/carla/carla_ros_ws/custom.repos:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    command: >
      /bin/bash -c "
        sudo sysctl -w net.core.rmem_max=2147483647 &&
        sudo ip link set lo multicast on &&
        source /opt/ros/humble/setup.bash &&
        source /home/carla/carla_ros_ws/install/setup.bash &&
        sleep infinity
      "

volumes:
  autoware-data:
