# docker-compose.yml — CARLA + Autoware full stack (default)
#
# Requirements:
#   Docker >= 24, docker compose v2
#   NVIDIA Container Toolkit: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#   Copy .env.example to .env and edit as needed.
#
# Usage:
#   docker compose up                          # start all services
#   docker compose up --profile traffic        # also spawn dynamic traffic
#   docker compose logs -f carla-ros-bridge    # stream a service's logs
#   docker compose exec autoware bash          # open shell in running container

x-ros-common: &ros-common
  network_mode: host
  ipc: host
  pid: host
  environment: &ros-env
    ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    RCUTILS_COLORIZED_OUTPUT: "1"

services:

  # ── CARLA UE4 Simulator ──────────────────────────────────────────────────
  carla-server:
    build:
      context: .
      dockerfile: docker/carla-server/Dockerfile
      args:
        CARLA_VERSION: "${CARLA_VERSION:-0.9.15}"
    image: "ads/carla-server:${CARLA_VERSION:-0.9.15}"
    container_name: carla-server
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      DISPLAY: "${DISPLAY:-:0}"
      SDL_VIDEODRIVER: "${SDL_VIDEODRIVER:-offscreen}"
      CARLA_HEADLESS: "${CARLA_HEADLESS:-true}"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    ports:
      - "2000:2000"
      - "2001:2001"
      - "2002:2002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, video, display, utility]
    command: >
      /bin/bash -c "
        if [ \"$${CARLA_HEADLESS:-true}\" = \"true\" ]; then
          exec /bin/bash ./CarlaUE4.sh
            -prefernvidia -nosound
            -benchmark -fps=${CARLA_FPS:-20}
            -RenderOffScreen
            -quality-level=${CARLA_QUALITY:-Low};
        else
          exec /bin/bash ./CarlaUE4.sh
            -prefernvidia -nosound
            -benchmark -fps=${CARLA_FPS:-20}
            -quality-level=${CARLA_QUALITY:-Low};
        fi
      "
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import carla; c=carla.Client('localhost',2000); c.set_timeout(5.0); c.get_server_version()"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ── CARLA ROS2 Bridge ────────────────────────────────────────────────────
  carla-ros-bridge:
    build:
      context: .
      dockerfile: docker/carla-ros-bridge/Dockerfile
      args:
        CARLA_VERSION: "${CARLA_VERSION:-0.9.15}"
    image: "ads/carla-ros-bridge:${CARLA_VERSION:-0.9.15}-humble"
    container_name: carla-ros-bridge
    restart: unless-stopped
    runtime: nvidia
    depends_on:
      carla-server:
        condition: service_healthy
    <<: *ros-common
    environment:
      <<: *ros-env
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      CARLA_HOST: "${CARLA_HOST:-localhost}"
      CARLA_PORT: "${CARLA_PORT:-2000}"
      CARLA_TOWN: "${CARLA_TOWN:-Town01}"
      CARLA_FPS: "${CARLA_FPS:-20}"
    volumes:
      - ./config:/config:ro
      - ./launch:/launch:ro
      - ./data/waypoints:/waypoints:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    command: >
      /bin/bash -c "
        sudo sysctl -w net.core.rmem_max=2147483647 &&
        sudo ip link set lo multicast on &&
        source /opt/ros/humble/setup.bash &&
        source /home/carla/carla_ros_ws/install/setup.bash &&
        ros2 launch autonomous_driving_simulators carla/carla_ros_bridge.launch.py
          host:=$${CARLA_HOST}
          port:=$${CARLA_PORT}
          town:=$${CARLA_TOWN}
          fixed_delta_seconds:=0.05
          synchronous_mode:=True
          use_sim_time:=True
      "

  # ── Autoware Full Stack ──────────────────────────────────────────────────
  autoware:
    build:
      context: .
      dockerfile: docker/autoware/Dockerfile
    image: ads/autoware:humble-2024.06
    container_name: autoware
    restart: unless-stopped
    runtime: nvidia
    depends_on:
      - carla-ros-bridge
    <<: *ros-common
    environment:
      <<: *ros-env
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      MPC_MODEL_PATH: "${MPC_MODEL_PATH:-/home/carla/sdks/mpc/carla}"
      WAYPOINTS_CSV: "${WAYPOINTS_CSV:-/waypoints/waypoints.csv}"
      VEHICLE_ID: "${VEHICLE_ID:-default}"
    volumes:
      - ./config:/config:ro
      - ./launch:/launch:ro
      - ./maps:/maps:ro
      - ./data/waypoints:/waypoints:ro
      - autoware-data:/home/carla/autoware_data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    command: >
      /bin/bash -c "
        sudo sysctl -w net.core.rmem_max=2147483647 &&
        sudo ip link set lo multicast on &&
        source /opt/ros/humble/setup.bash &&
        source /home/carla/carla_ros_ws/install/setup.bash &&
        ros2 launch autonomous_driving_simulators autoware/autoware.launch.xml
          use_sim_time:=true
          launch_perception:=true
      "

  # ── Traffic Generator (optional, --profile traffic) ──────────────────────
  traffic-generator:
    build:
      context: .
      dockerfile: docker/traffic-generator/Dockerfile
      args:
        CARLA_VERSION: "${CARLA_VERSION:-0.9.15}"
    image: "ads/traffic-generator:${CARLA_VERSION:-0.9.15}"
    container_name: traffic-generator
    restart: "no"
    profiles:
      - traffic
    depends_on:
      carla-server:
        condition: service_healthy
    network_mode: host
    environment:
      CARLA_HOST: "${CARLA_HOST:-localhost}"
      CARLA_PORT: "${CARLA_PORT:-2000}"
    command: >
      python3 /scripts/generate_traffic.py
        --host ${CARLA_HOST:-localhost}
        --port ${CARLA_PORT:-2000}
        --number-of-vehicles ${NUM_VEHICLES:-30}
        --number-of-walkers ${NUM_WALKERS:-10}
        --hybrid --safe --respawn --asynch

volumes:
  autoware-data:
