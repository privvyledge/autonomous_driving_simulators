# docker-compose.yml — CARLA + Autoware full stack (default)
#
# Requirements:
#   Docker >= 24, docker compose v2
#   NVIDIA Container Toolkit: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#   Copy .env.example to .env and edit as needed.
#
# Usage:
#   docker compose up                          # start all services
#   docker compose up --profile traffic        # also spawn dynamic traffic
#   docker compose logs -f carla-ros-bridge    # stream a service's logs
#   docker compose exec autoware bash          # open shell in running container

x-ros-common: &ros-common
  network_mode: host
  ipc: host
  pid: host
  environment: &ros-env
    ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    RCUTILS_COLORIZED_OUTPUT: "1"

services:

  # ── CARLA UE4 Simulator ──────────────────────────────────────────────────
  carla-server:
    build:
      context: .
      dockerfile: docker/carla-server/Dockerfile
      args:
        CARLA_VERSION: "${CARLA_VERSION:-0.9.14}"
    image: "ads/carla-server:${CARLA_VERSION:-0.9.14}"
    container_name: carla-server
    restart: unless-stopped
    runtime: nvidia
    privileged: true
    shm_size: '8g'
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      CARLA_HEADLESS: "${CARLA_HEADLESS:-true}"
    volumes:
      - /dev:/dev
    ports:
      - "2000:2000"
      - "2001:2001"
      - "2002:2002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, video, display, utility]
    # Port probe (not `import carla`): the carla-server image has no carla Python
    # module on PYTHONPATH, so an import-based check is unhealthy forever. CARLA's
    # RPC port 2000 == 0x7D0; a listening socket shows as ':07D0' in /proc/net/tcp.
    healthcheck:
      test: ["CMD-SHELL", "grep -qi ':07D0 ' /proc/net/tcp || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ── CARLA ROS2 Bridge ────────────────────────────────────────────────────
  carla-ros-bridge:
    build:
      context: .
      dockerfile: docker/carla-ros-bridge/Dockerfile
      args:
        CARLA_VERSION: "${CARLA_VERSION:-0.9.14}"
    image: "ads/carla-ros-bridge:${CARLA_VERSION:-0.9.14}-humble"
    container_name: carla-ros-bridge
    restart: unless-stopped
    runtime: nvidia
    depends_on:
      carla-server:
        condition: service_healthy
    <<: *ros-common
    environment:
      <<: *ros-env
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      CARLA_HOST: "${CARLA_HOST:-localhost}"
      CARLA_PORT: "${CARLA_PORT:-2000}"
      CARLA_TOWN: "${CARLA_TOWN:-Town01}"
      CARLA_FPS: "${CARLA_FPS:-20}"
      REMAP_TO_AUTOWARE: "${REMAP_TO_AUTOWARE:-False}"
      LAUNCH_BUILTIN_AGENT: "${LAUNCH_BUILTIN_AGENT:-True}"
      # Run CARLA low-level actuation (carla_ackermann_control / carla_twist_to_control)
      # here for the custom-controller path. Set True together with LAUNCH_BUILTIN_AGENT=False.
      LAUNCH_ACTUATION: "${LAUNCH_ACTUATION:-False}"
      PUBLISH_TWIST: "${PUBLISH_TWIST:-False}"
      OBJECTS_DEFINITION_FILE: "${OBJECTS_DEFINITION_FILE:-/config/obstacles.json}"
      SPAWN_POINT: "${SPAWN_POINT:-0.8798897862434387,-1.6753101348876953,4.0,-0.035736084,0.0263918489,-88.118721}"
      # True: bridge calls load_world(CARLA_TOWN). False: attach to the already-loaded
      # map (skips load_world) — set False when a heavy-map reload crashes the server.
      RELOAD_MAP: "${RELOAD_MAP:-True}"
      # True: launch the carla_manual_control pygame viewer (needs DISPLAY + a spawned ego).
      VIEW: "${VIEW:-False}"
    volumes:
      - ./config:/config:ro
      - ./launch:/launch:ro
      # Live launch editing without an image rebuild: --symlink-install makes the
      # installed launch dir a symlink into the package SOURCE dir, so mounting the
      # host launch dir over that source path means `ros2 launch <pkg> ...` reads
      # the host files directly. Edits to INCLUDED launch files still need a rebuild.
      - ./launch:/home/carla/carla_ros_ws/src/autonomous_driving_simulators/launch:ro
      - ./data/waypoints:/waypoints:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    command: >
      /bin/bash -c "
        sudo sysctl -w net.core.rmem_max=2147483647 || true;
        sudo ip link set lo multicast on || true;
        source /opt/ros/humble/setup.bash &&
        source /home/carla/carla_ros_ws/install/setup.bash &&
        ros2 launch autonomous_driving_simulators simulation_bringup.launch.py host:=$${CARLA_HOST} port:=$${CARLA_PORT} town:=$${CARLA_TOWN} reload_map:=$${RELOAD_MAP} view:=$${VIEW} fixed_delta_seconds:=0.05 synchronous_mode:=True use_sim_time:=True remap_to_autoware:=$${REMAP_TO_AUTOWARE} launch_builtin_agent:=$${LAUNCH_BUILTIN_AGENT} launch_actuation:=$${LAUNCH_ACTUATION} publish_twist:=$${PUBLISH_TWIST} objects_definition_file:=$${OBJECTS_DEFINITION_FILE} spawn_point:=$${SPAWN_POINT}
      "

  # ── Autoware Full Stack ──────────────────────────────────────────────────
  autoware:
    build:
      context: .
      dockerfile: docker/autoware/Dockerfile
    image: ads/autoware:humble-2024.06
    container_name: autoware
    restart: unless-stopped
    runtime: nvidia
    depends_on:
      - carla-ros-bridge
    <<: *ros-common
    environment:
      <<: *ros-env
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      MPC_MODEL_PATH: "${MPC_MODEL_PATH:-/home/carla/data/mpc/carla}"
      WAYPOINTS_CSV: "${WAYPOINTS_CSV:-/waypoints/waypoints.csv}"
      VEHICLE_ID: "${VEHICLE_ID:-default}"
    volumes:
      - ./config:/config:ro
      - ./launch:/launch:ro
      - ./maps:/maps:ro
      - ./data/waypoints:/waypoints:ro
      # Writable host-backed dir: compiled MPC model (MPC_MODEL_PATH), recordings, etc.
      - ./data:/home/carla/data:rw
      - autoware-data:/home/carla/autoware_data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    command: >
      /bin/bash -c "
        sudo sysctl -w net.core.rmem_max=2147483647 || true;
        sudo ip link set lo multicast on || true;
        source /opt/ros/humble/setup.bash &&
        source /home/carla/carla_ros_ws/install/setup.bash &&
        ros2 launch autonomous_driving_simulators autoware/autoware.launch.xml use_sim_time:=true launch_perception:=true &
        ros2 launch autonomous_driving_simulators autoware/carla_autoware_bridge.launch.py use_sim_time:=true &&
        wait
      "

  # ── Custom Control & Mapping Nodes ───────────────────────────────────────
  custom-nodes:
    build:
      context: .
      dockerfile: docker/custom-nodes/Dockerfile
    image: ads/custom-nodes:humble
    container_name: custom-nodes
    restart: unless-stopped
    runtime: nvidia
    depends_on:
      - carla-ros-bridge
    <<: *ros-common
    environment:
      <<: *ros-env
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      MPC_MODEL_PATH: "${MPC_MODEL_PATH:-/home/carla/data/mpc/carla}"
      WAYPOINTS_CSV: "${WAYPOINTS_CSV:-/waypoints/waypoints.csv}"
      # Persist Ultralytics weights/config on the host (./data/models) instead of
      # the ephemeral container layer; also silences the "config dir not writable" warning.
      YOLO_CONFIG_DIR: "${YOLO_CONFIG_DIR:-/home/carla/data/models/ultralytics}"
    volumes:
      - ./config:/config:ro
      - ./launch:/launch:ro
      - ./maps:/maps:ro
      - ./data/waypoints:/waypoints:ro
      # Writable host-backed scratch/output dir: YOLO .pt/.onnx/.engine models,
      # MPC build artifacts, recorded waypoints, videos, etc. persist across recreates.
      - ./data:/home/carla/data:rw
      - ./custom.repos:/home/carla/carla_ros_ws/custom.repos:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    command: >
      /bin/bash -c "
        sudo sysctl -w net.core.rmem_max=2147483647 || true;
        sudo ip link set lo multicast on || true;
        source /opt/ros/humble/setup.bash &&
        source /home/carla/carla_ros_ws/install/setup.bash &&
        sleep infinity
      "

  # ── Traffic Generator (optional, --profile traffic) ──────────────────────
  traffic-generator:
    build:
      context: .
      dockerfile: docker/traffic-generator/Dockerfile
      args:
        CARLA_VERSION: "${CARLA_VERSION:-0.9.14}"
    image: "ads/traffic-generator:${CARLA_VERSION:-0.9.14}"
    container_name: traffic-generator
    restart: "no"
    profiles:
      - traffic
    depends_on:
      carla-server:
        condition: service_healthy
    network_mode: host
    environment:
      CARLA_HOST: "${CARLA_HOST:-localhost}"
      CARLA_PORT: "${CARLA_PORT:-2000}"
    command: >
      python3 /scripts/generate_traffic.py
        --host ${CARLA_HOST:-localhost}
        --port ${CARLA_PORT:-2000}
        --number-of-vehicles ${NUM_VEHICLES:-30}
        --number-of-walkers ${NUM_WALKERS:-10}
        --hybrid --safe --respawn --asynch

volumes:
  autoware-data:
