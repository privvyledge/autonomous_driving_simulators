# docker-compose-native.override.yml
#
# Native-Linux override for running carla-server + carla-ros-bridge with the
# carla_manual_control pygame viewer and RViz, using a local X server.
#
# NOTE: docker compose only AUTO-merges a file named exactly
# "docker-compose.override.yml". This file has a custom name, so either:
#   (a) rename it to docker-compose.override.yml, or
#   (b) pass it explicitly every command, e.g.:
#       docker compose -f docker-compose.yml -f docker-compose-native.override.yml up carla-server carla-ros-bridge custom-nodes -d
#
# Before starting, grant local X access on the host:
#   xhost +local:docker

services:

  # ── CARLA ROS Bridge ─────────────────────────────────────────────────────
  carla-ros-bridge:
    environment:
      CARLA_HOST: localhost          # carla-server is a local container
      CARLA_TOWN: Town01             # light map; reload survives
      RELOAD_MAP: "True"
      LAUNCH_BUILTIN_AGENT: "False"  # disable AD agent so it doesn't fight manual control
      VIEW: "True"                   # launch the carla_manual_control pygame window
      DISPLAY: "${DISPLAY:-:0}"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix

  # ── Custom Nodes (run RViz from here, per CARLA_TESTS.md Test 2) ──────────
  custom-nodes:
    environment:
      CARLA_HOST: localhost
      DISPLAY: "${DISPLAY:-:0}"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
