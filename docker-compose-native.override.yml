# docker-compose-native.override.yml
#
# Native-Linux override for running carla-server + carla-ros-bridge with the
# carla_manual_control pygame viewer and RViz on a remote host reached over
# SSH X11 forwarding (DISPLAY=localhost:NN.0, a TCP display).
#
# NOTE: docker compose only AUTO-merges a file named exactly
# "docker-compose.override.yml". This file has a custom name, so either:
#   (a) rename it to docker-compose.override.yml, or
#   (b) pass it explicitly every command, e.g.:
#       docker compose -f docker-compose.yml -f docker-compose-native.override.yml up carla-server carla-ros-bridge custom-nodes -d
#
# X11 over SSH forwarding (DISPLAY=localhost:NN.0):
#   The forwarded display is a TCP socket, NOT /tmp/.X11-unix, and the
#   container has no X auth cookie -> "No authorisation provided". The container
#   needs a wildcard (FamilyWild) cookie at /tmp/.docker.xauth. Use the helper,
#   which generates the cookie AND (re)creates the services in the right order:
#
#     ./scripts/setup_x11_forwarding.sh --up
#
#   Two gotchas that script handles (and that bite if you do it by hand):
#     1. /tmp/.docker.xauth MUST already exist as a FILE before `up`; if it does
#        not, Docker bind-mounts it as an empty directory and no cookie is read.
#     2. SSH forwarding assigns a NEW display number each login (:10, :12, ...),
#        so a container from a previous session points at a dead display -- the
#        services must be recreated each session. Regenerate the cookie BEFORE
#        recreating: Docker mounts the file by inode, so edits to an already-
#        mounted cookie are not seen by a running container.
#
#   The services run with network_mode: host, so the container reaches the
#   forwarded X server at 127.0.0.1 directly. DISPLAY keeps its real value (do
#   NOT force :0); the services inherit it, so run rviz2 via `exec` WITHOUT
#   re-passing `-e DISPLAY` (that would override it with another session's
#   stale display). For a local console X server (DISPLAY=:0) the same helper
#   works; `xhost +local:docker` is an alternative.

services:

  # ── CARLA ROS Bridge ─────────────────────────────────────────────────────
  carla-ros-bridge:
    environment:
      CARLA_HOST: localhost          # carla-server is a local container
      CARLA_TOWN: "${CARLA_TOWN:-Town01}"                     # light map; reload survives
      RELOAD_MAP: "${RELOAD_MAP:-True}"
      LAUNCH_BUILTIN_AGENT: "${LAUNCH_BUILTIN_AGENT:-False}"  # default off so it doesn't fight manual control; LAUNCH_BUILTIN_AGENT=True to enable
      VIEW: "${VIEW:-True}"                                   # default on (carla_manual_control pygame viewer); VIEW=False to disable
      DISPLAY: "${DISPLAY}"          # real forwarded display, e.g. localhost:12.0
      XAUTHORITY: /tmp/.docker.xauth
      XDG_RUNTIME_DIR: /tmp/runtime-carla
    volumes:
      - /tmp/.docker.xauth:/tmp/.docker.xauth:ro
      - /tmp/.X11-unix:/tmp/.X11-unix   # harmless; used only for local :0 displays

  # ── Custom Nodes (run RViz from here, per CARLA_TESTS.md Test 2) ──────────
  custom-nodes:
    environment:
      CARLA_HOST: localhost
      DISPLAY: "${DISPLAY}"
      XAUTHORITY: /tmp/.docker.xauth
      XDG_RUNTIME_DIR: /tmp/runtime-carla
    volumes:
      - /tmp/.docker.xauth:/tmp/.docker.xauth:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
