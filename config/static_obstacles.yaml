# Which baked level geometry to treat as obstacles.
#
# CARLA tags every piece of static level geometry with a carla.CityObjectLabel.
# scripts/dump_static_obstacles.py and scripts/static_obstacle_publisher.py read
# this file via --config and extract every label set to true.
#
# The list below is the CityObjectLabel enum as of CARLA 0.9.14/0.9.15. It is
# NOT authoritative for your build -- ask the running simulator instead, which
# also reports how many objects each label actually holds on the current map:
#
#   docker compose exec carla-ros-bridge python3 /scripts/dump_static_obstacles.py --list-labels
#
# Anything unknown to the connected CARLA is skipped with a warning rather than
# being a hard error, so this file stays portable across versions.

labels:

  # ── Genuine roadside obstacles ────────────────────────────────────────────
  Poles: true            # light poles, sign posts. Town01: 220 objects.
  TrafficSigns: true     # sign faces and their posts
  TrafficLight: true     # traffic light heads + masts
  Fences: true           # garden/plot fencing. Town01: 426 in the route window,
                         # nearly all 1-3 m panel segments along the sidewalk.
  Walls: true            # low perimeter walls. Town01: 481 in the route window.
                         # Both of these also carry a handful of spline meshes
                         # whose single AABB spans a whole plot -- max_footprint
                         # below drops those.
  GuardRail: false
  Static: true           # catch-all for props. On Town01 this is where the fire
                         # hydrants, bollards and chain barriers live: solid in
                         # the simulator, and no other label reports them, so the
                         # ego collided with obstacles no topic published.
                         # Also brings in plant pits, planters and fountains.

  # ── Structures. Off-road in Town01; large boxes that will dominate the
  #    output if enabled. Useful for parking lots or narrow alleys. ──────────
  Buildings: false
  Bridge: false

  # ── Not obstacles: drivable/paintable surfaces. Enabling these makes the
  #    road itself an obstacle and the map instantly unsolvable. ─────────────
  Roads: false
  RoadLines: false
  Sidewalks: false
  Ground: false
  Terrain: false
  Water: false
  Sky: false

  # ── Dynamic things. These already reach ROS as *actors* on
  #    /carla/ego_vehicle/objects, so extracting them here would double-count
  #    them in the merger. Leave false unless the bridge is not running. ─────
  Vehicles: false
  Pedestrians: false
  Dynamic: false

  # ── Remaining enum members, off by default. ───────────────────────────────
  Vegetation: false      # tree trunks are real obstacles, but the label also
                         # covers overhanging canopy -- pair with z_band.
  RailTrack: false
  Other: false
  Any: false             # everything at once; for exploration only.

# Optional defaults. Command-line flags override anything set here; omit a key
# to leave that filter off.
defaults:

  # Height window MIN,MAX in metres, ROS frame. An object is kept only if its
  # vertical extent overlaps this band.
  #
  # This matters more than it looks. A CARLA street lamp is three sub-meshes:
  # two thin pole pieces (radius ~0.25 m) and an arm whose bounding box has a
  # ~1.93 m radius, sitting several metres up and reaching out over the
  # carriageway. Without a height filter that arm becomes a ~4 m wide ground
  # obstacle and the street is impassable to a planner.
  z_band: [0.0, 2.5]

  # The band alone is not enough. That same lamp's third sub-mesh is the pole
  # AND the arm in ONE box: its z span starts at the ground (so it survives the
  # band) while its ~3.8 m wide AABB is centred out over the carriageway --
  # measured on Town01, pole base at CARLA x=94.99, box centre at x=93.28.
  # CARLA exposes one axis-aligned box per mesh and no way to clip it to the
  # band, but env.transform.location is the mesh pivot (the pole base) and sits
  # inside that footprint. So an object that pokes above the band, is wider
  # than a post, and contains its own pivot is republished as a square post of
  # half-width slim_radius at the pivot, clipped to the band.
  slim_overhead: true
  slim_radius: 0.3

  # Drop an object whose SMALLER horizontal dimension exceeds this, in metres.
  # 0 disables.
  #
  # CARLA reports one axis-aligned box per mesh, and a spline fence or wall that
  # turns a corner comes back as a box spanning its whole plot. Town01's
  # SM_Town01_Fence02 is a 34.9 x 16.3 m box centred at ROS (9.3, -328.6): the
  # fence runs along the plot edges, but the box swallows the carriageway at the
  # south end of the test route. A barrier that is genuinely solid is thin in one
  # direction (a 0.28 x 6.4 m wall segment survives at any setting here); a box
  # many metres across in BOTH directions is an artefact of the AABB.
  #
  # 8.0 drops exactly three objects on Town01 (Fence02, Wall02, Wall03) and keeps
  # every compact prop, including the 6.3 m fountains.
  max_footprint: 8.0

  # Extraction window centre (ROS x,y) and radius in metres. The Town01 test
  # route runs y = -2 .. -330 at x ~ -2, so this covers it.
  near: [-2.0, -165.0]
  radius: 200.0
